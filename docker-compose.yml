version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SEARCH_API_KEY=${SEARCH_API_KEY}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-tavily}
      - DATABASE_URL=sqlite+aiosqlite:///./multi_agent_research.db
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key}
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_data:
